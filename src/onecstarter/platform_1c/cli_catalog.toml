description = """Имя как в списке пользователей информационной базы, пишется вплотную к ключу. При запуске по /IBName в форме /N"имя" вместе с /P перекрывает данные из списка баз, вход проходит без диалога."""
its = "Приложение 7, 7.3.2"
reliability = "fact"
args = [{ kind = "string", attached = true, quoted = true, required = true, label = "имя пользователя" }]

[[key]]
name = "/P"
group = "auth"
modes = ["enterprise", "designer"]
clients = []
versions = { since = "8.3.18" }
summary = "пароль пользователя"
