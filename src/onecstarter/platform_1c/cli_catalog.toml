its = "Приложение 7, 7.3.5"
reliability = "doc"
args = [{ kind = "enum", values = ["-Normal", "-Workplace", "-EmbeddedWorkplace", "-FullscreenWorkplace", "-Kiosk"], required = true, label = "режим окна" }]

[[key]]
name = "/AppShortCaption"
