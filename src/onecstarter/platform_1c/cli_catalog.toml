# Каталог ключей командной строки 1С:Предприятия (клиентские ключи, раздел 7.3 «Приложения 7», 8.5.4).
# Описания написаны своими словами; названия и синтаксис ключей — факты платформы.
# Поле versions: build/catalog_versions.py (since/until по Приложению 7 версий 8.3.18…8.5.4).

[[group]]
id = "debug"
title = "Отладка и диагностика"
order = 10

[[group]]
id = "startup"
title = "Сообщения и диалоги при старте"
order = 20

[[group]]
id = "locale"
title = "Язык и локализация"
order = 30

[[group]]
id = "ui"
title = "Окно и интерфейс"
order = 40

[[group]]
id = "auth"
title = "Аутентификация"
order = 50

[[group]]
id = "connection"
title = "Соединение и сжатие"
order = 60

[[group]]
id = "version"
title = "Версия, клиент, разрядность"
order = 70

[[group]]
id = "config"
title = "Параметры конфигурации"
order = 80

[[group]]
id = "thick"
title = "Режим толстого клиента"
order = 90

[[group]]
id = "other"
title = "Прочие"
order = 100

# ---------------------------------------------------------------- debug

[[key]]
name = "/Debug"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "запуск в режиме отладки"
description = """Клиент стартует с отладкой. Протокол выбирают -tcp или -http; -attach (только для HTTP) сам подключает предметы отладки к серверу отладки, адрес которого задаёт ключ /DebuggerURL."""
its = "Приложение 7, 7.3.7"
reliability = "doc"
args = [
  { kind = "enum", values = ["-tcp", "-http"], label = "протокол" },
  { kind = "flag", flag = "-attach", requires = "-http", label = "подключать предметы отладки автоматически" },
]

[[key]]
name = "/DebuggerURL"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "адрес отладчика или сервера отладки"
description = """При отладке по TCP это адрес отладчика, при отладке по HTTP — адрес сервера отладки вместе с портом, а не только имя компьютера."""
its = "Приложение 7, 7.3.7"
reliability = "doc"
args = [{ kind = "string", required = true, label = "адрес отладчика" }]

[[key]]
name = "/EmulateServerCallDelay"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "имитация медленного соединения"
description = """Чтобы посмотреть, как приложение ведёт себя на плохой связи: клиент добавляет паузу к каждому обращению к серверу (-Call, без значения — 1.45 с) и к каждому отправленному (-Send, 0.45 с) и полученному (-Recevie, 0.15 с) килобайту. Секунды пишутся вплотную к подключу, предел — 9.99 с. Опечатка в -Recevie — из документации; программа передаёт подключ в том же виде."""
its = "Приложение 7, 7.3.7"
reliability = "doc"
args = [
  { kind = "string", flag = "-Call", attached = true, label = "задержка вызова, с" },
  { kind = "string", flag = "-Send", attached = true, label = "задержка отправки на 1 КБ, с" },
  { kind = "string", flag = "-Recevie", attached = true, label = "задержка приёма на 1 КБ, с" },
]

[[key]]
name = "/TestManager"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "запуск как менеджер тестирования"
description = """Толстый или тонкий клиент поднимается как управляющий: он командует клиентами тестирования через специальную объектную модель."""
its = "Приложение 7, 7.3.8"
reliability = "doc"

[[key]]
name = "/TestClient"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "запуск как клиент тестирования"
description = """Любое клиентское приложение работает под управлением менеджера тестирования. Порт по умолчанию 1538; идентификатор различает несколько клиентов одного менеджера (веб и мобильный); адрес публикации нужен мобильному приложению."""
its = "Приложение 7, 7.3.8"
reliability = "doc"
args = [
  { kind = "int", flag = "-TPort", attached = true, label = "порт" },
  { kind = "string", flag = "-TestClientID", attached = true, label = "идентификатор" },
  { kind = "string", flag = "-TURL=", attached = true, label = "адрес публикации" },
]

[[key]]
name = "/UILogRecorder"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "запись журнала действий пользователя"
description = """Клиент записывает интерактивные действия в журнал, из которого можно получить код на встроенном языке для их воспроизведения. Сочетается с /TestClient. Если менеджер тестирования не подключён, журнал после записи сохраняется в указанный файл."""
its = "Приложение 7, 7.3.8"
reliability = "doc"
args = [
  { kind = "int", flag = "-TPort", attached = true, label = "порт" },
  { kind = "file", flag = "-File", attached = true, label = "файл журнала" },
]

[[key]]
name = "/EnableCheckModal"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "строгая проверка модальных методов"
description = """Включает жёсткий контроль того, как код пользуется модальными методами."""
its = "Приложение 7, 7.3.9"
reliability = "doc"

[[key]]
name = "/EnableCheckExtensionsAndAddInsSyncCalls"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "проверка синхронных вызовов расширений и компонент"
description = """Включает строгий контроль синхронных вызовов расширений работы с файлами и криптографией, а также внешних компонент. В толстом клиенте ключ не действует."""
its = "Приложение 7, 7.3.9"
reliability = "doc"

[[key]]
name = "/EnableCheckServerCalls"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "проверка контекстных серверных вызовов формы"
description = """Если в обработчике события формы, где серверный вызов запрещён, он всё же происходит, в окно сообщений выводится предупреждение; то же сообщение видно в информации для техподдержки."""
its = "Приложение 7, 7.3.9"
reliability = "doc"

[[key]]
name = "/EnableCheckScriptCircularRefs"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "поиск циклических ссылок в коде"
description = """Во время исполнения встроенного языка платформа ищет циклические ссылки между объектами."""
its = "Приложение 7, 7.3.9"
reliability = "doc"

[[key]]
name = "/TechnicalSpecialistMode"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "меню «Функции для технического специалиста»"
description = """Делает доступной в главном меню клиента команду с инструментами для технического специалиста."""
its = "Приложение 7, 7.3.5"
reliability = "doc"

[[key]]
name = "/DisplayPerformance"
group = "debug"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "показатели обмена с сервером"
description = """В клиенте выводятся счётчики: сколько было вызовов сервера и сколько данных отправлено на сервер и получено от него."""
its = "Приложение 7, 7.3.7"
reliability = "doc"

# ---------------------------------------------------------------- startup

[[key]]
name = "/DisableStartupMessages"
group = "startup"
modes = ["enterprise", "designer"]
clients = []
versions = { since = "8.3.18" }
summary = "не показывать стартовые сообщения"
description = """Подавляет предупреждения при запуске, например о несовпадении конфигурации базы с сохранённой или о нехватке возможностей компьютера для редактирования справки и html."""
its = "Приложение 7, 7.3.12"
reliability = "doc"

[[key]]
name = "/DisableStartupDialogs"
group = "startup"
modes = ["enterprise", "designer"]
clients = []
versions = { since = "8.3.18" }
summary = "не показывать стартовые диалоги и вход"
description = """Убирает стартовый диалог и диалоги аутентификации и переводит клиент в пакетный режим. Если командной строки не хватает для выбора базы, режима или входа, вместо диалога будет ошибка. Поддерживают Конфигуратор, тонкий и толстый клиенты."""
its = "Приложение 7, 7.3.12"
reliability = "doc"

[[key]]
name = "/DisableSplash"
group = "startup"
modes = ["enterprise", "designer"]
clients = []
versions = { since = "8.3.18" }
summary = "отключить заставку"
description = """Скрывает окно заставки, но только если оно было полностью заменено; саму замену заставки делает фирма «1С»."""
its = "Приложение 7, 7.3.12"
reliability = "doc"

[[key]]
name = "/DisableUnrecoverableErrorMessage"
group = "startup"
modes = ["enterprise", "designer"]
clients = []
versions = { since = "8.3.18" }
summary = "без окна при невосстановимой ошибке"
description = """При фатальной ошибке окно не показывается, дамп пишется по настройкам logcfg.xml (в Windows), отчёт уходит при настроенной автоотправке и размере до 5 МБ, процесс завершается с ненулевым кодом. Подходит для окружения без пользователя."""
its = "Приложение 7, 7.3.12"
reliability = "doc"

[[key]]
name = "/DisableHomePageForms"
group = "startup"
modes = ["enterprise"]
clients = ["thin"]
versions = { since = "8.3.23" }
summary = "не открывать формы начальной страницы"
description = """Тонкий клиент при старте не открывает формы начальной страницы прикладного решения."""
its = "Приложение 7, 7.3.12"
reliability = "doc"

[[key]]
name = "/DisplayUserNotificationList"
group = "startup"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "показать непрочитанные оповещения при старте"
description = """При запуске клиент выводит непрочитанные сообщения из системы взаимодействия и центра оповещений."""
its = "Приложение 7, 7.3.12"
reliability = "doc"

[[key]]
name = "/DisableBackgroundIndexBuild"
group = "startup"
modes = ["designer"]
clients = []
versions = { since = "8.3.27" }
summary = "без фонового индекса рефакторинга"
description = """Конфигуратор не строит при запуске индекс, нужный для поиска ссылок на объект, его удаления и переименования."""
its = "Приложение 7, 7.3.12"
reliability = "doc"

[[key]]
name = "/Out"
group = "startup"
modes = ["enterprise", "designer"]
clients = []
versions = { since = "8.3.18" }
summary = "файл служебных сообщений"
description = """Платформа пишет сообщения в указанный файл в UTF-8; без -NoTruncate файл очищается. Файл создаётся сразу при запуске, и пока сообщений нет, в нём только BOM UTF-8. В пакетных режимах запись идёт без буферизации, так что файл можно читать во время работы."""
its = "Приложение 7, 7.3.12"
reliability = "fact"
args = [
  { kind = "file", required = true, label = "файл сообщений" },
  { kind = "flag", flag = "-NoTruncate", label = "не очищать файл" },
]

# ---------------------------------------------------------------- locale

[[key]]
name = "/L"
group = "locale"
modes = ["enterprise", "designer"]
clients = []
