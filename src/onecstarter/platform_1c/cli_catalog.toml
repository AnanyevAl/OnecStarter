description = """Система открывается со списком баз из указанного файла общего списка (.v8i) или ярлыка (.v8l)."""
its = "Приложение 7, 7.3.10"
reliability = "doc"
args = [{ kind = "file", required = true, label = "файл списка (.v8i, .v8l)" }]

[[key]]
name = "/@"
group = "other"
modes = ["enterprise"]
clients = []
versions = { since = "8.3.18" }
summary = "командная строка из файла"
description = """Для строк запуска длиннее, чем разрешает ОС: команда целиком, одной строкой, кладётся в файл, и платформа читает её оттуда вместо настоящей. Поэтому ключ ставится первым или единственным — в другом месте результат не определён. Кодировка файла — та же, что у интерпретатора, из которого запускают."""
its = "Приложение 7, 7.3.12"
reliability = "doc"
args = [{ kind = "file", required = true, label = "файл с командной строкой" }]

# ── Команды пакетного режима Конфигуратора (раздел 7.4 «Приложения 7», 8.5.4) ──────────
# exclusive = true измерено только у /DumpIB (T-42 Э7); у остальных — по смыслу операции.
# Взаимоисключающие подпараметры разнесены в отдельные аргументы; в подписи каждого
# сказано «не вместе с …». Диапазоны версий (versions) — build/catalog_versions.py.

[[group]]
id = "backup"
title = "Резерв и конфигурация"
order = 110

[[group]]
id = "maintenance"
title = "Обслуживание и проверки"
order = 120

[[group]]
id = "repository"
title = "Хранилище конфигурации"
order = 130

[[group]]
id = "external"
title = "Внешние обработки"
order = 140

# ── backup: выгрузка и загрузка базы, конфигурации, файлов ───────────────────────────────

[[command]]
name = "/DumpIB"
group = "backup"
effect = "none"
exclusive = true
summary = "выгрузить информационную базу в файл .dt"
description = """Сохраняет всю базу — данные и конфигурацию — в один файл выгрузки. Пока идёт выгрузка, в базе не должно быть других сеансов."""
its = "Приложение 7, 7.4.2"
reliability = "fact"
versions = { since = "8.3.18" }
args = [{ kind = "file", role = "output", ext = ".dt", required = true, label = "файл выгрузки" }]

# Базовая форма команды измерена в T-42 (часть Б); подпараметры — по документации.
[[command]]
name = "/RestoreIB"
group = "backup"
effect = "replaces"
exclusive = true
summary = "загрузить информационную базу из файла .dt"
description = """Полностью заменяет содержимое базы тем, что лежит в файле выгрузки: данные, конфигурацию и список пользователей. Прерванная загрузка оставляет базу испорченной."""
its = "Приложение 7, 7.4.2"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "file", role = "input", ext = ".dt", required = true, label = "файл выгрузки" },
  { kind = "enum", flag = "-UseBinaryDataStorage", attached = true, values = ["+", "-"], label = "двоичные данные — во встроенное хранилище" },
  { kind = "int", flag = "-JobsCount", label = "число фоновых заданий загрузки (0 — по числу процессоров)" },
]

# Базовая форма команды измерена в T-42 (часть Б); подпараметры — по документации.
[[command]]
name = "/DumpCfg"
group = "backup"
effect = "none"
exclusive = false
summary = "сохранить конфигурацию в файл .cf"
description = """Записывает основную конфигурацию базы в файл. С подпараметром -Extension сохраняется указанное расширение."""
its = "Приложение 7, 7.4.4.3"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "file", role = "output", ext = ".cf", required = true, label = "файл конфигурации (.cf, для расширения .cfe)" },
  { kind = "string", flag = "-Extension", label = "имя расширения" },
]

[[command]]
name = "/DumpDBCfg"
group = "backup"
effect = "none"
exclusive = false
summary = "сохранить конфигурацию базы данных в файл"
description = """Пишет в файл не рабочую конфигурацию, а ту, что сейчас хранится в самой базе данных. Для расширения укажите его имя в -Extension."""
its = "Приложение 7, 7.4.4.6"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "file", role = "output", ext = ".cf", required = true, label = "файл конфигурации (.cf, для расширения .cfe)" },
  { kind = "string", flag = "-Extension", label = "имя расширения" },
]

# Базовая форма команды измерена в T-42 (часть Б); подпараметры — по документации.
[[command]]
name = "/DumpConfigToFiles"
group = "backup"
effect = "none"
exclusive = false
summary = "выгрузить конфигурацию в файлы XML"
description = """Раскладывает конфигурацию по каталогу файлов. Можно выгрузить только изменившееся с прошлого раза, получить список изменений или записать результат в zip-архив."""
its = "Приложение 7, 7.4.4.5"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "dir", role = "output", required = true, label = "каталог выгрузки" },
  { kind = "string", flag = "-Extension", label = "имя расширения (не вместе с -AllExtensions)" },
  { kind = "flag", flag = "-AllExtensions", label = "выгрузить все расширения, без основной конфигурации (не вместе с -Extension)" },
  { kind = "flag", flag = "-update", label = "обновить прежнюю выгрузку: записать только изменившиеся объекты" },
  { kind = "flag", flag = "-force", requires = "-update", label = "при расхождении формата выгрузки сделать полную выгрузку (только с -update)" },
  { kind = "file", flag = "-getChanges", role = "output", label = "файл для списка изменений относительно прежней выгрузки" },
  { kind = "file", flag = "-configDumpInfoForChanges", role = "input", label = "файл версий ConfigDumpInfo.xml для сравнения (с -update или -getChanges)" },
  { kind = "file", flag = "-listFile", role = "input", label = "файл со списком объектов, которые выгрузить в любом случае (отдельно от других подпараметров)" },
  { kind = "flag", flag = "-configDumpInfoOnly", label = "создать только файл версий ConfigDumpInfo.xml" },
  { kind = "flag", flag = "-Server", label = "выгружать на стороне сервера 1С:Предприятия" },
  { kind = "int", flag = "-JobsCount", requires = "-Server", label = "число фоновых заданий выгрузки (0 — подберёт платформа; только с -Server)" },
  { kind = "file", flag = "-archive", role = "output", ext = ".zip", label = "zip-архив для результата" },
  { kind = "flag", flag = "-ignoreUnresolvedReferences", label = "пропускать ссылки, ведущие на давно удалённые объекты" },
]

[[command]]
name = "/DumpDBCfgList"
group = "backup"
effect = "none"
exclusive = false
summary = "вывести имена конфигурации или расширений базы"
description = """Без подпараметров показывает имя основной конфигурации, с ними — имя одного расширения или всех. Вывод попадает в файл, заданный ключом /Out."""
its = "Приложение 7, 7.4.4.7"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "string", flag = "-Extension", label = "имя расширения (не вместе с -AllExtensions)" },
  { kind = "flag", flag = "-AllExtensions", label = "показать все расширения (не вместе с -Extension)" },
]

[[command]]
name = "/CompareCfg"
group = "backup"
effect = "none"
exclusive = false
summary = "сравнить две конфигурации и записать отчёт"
description = """Сопоставляет две конфигурации из разных источников — основной, базы, поставщика, расширения, хранилища или файла — и сохраняет отчёт о различиях. Каждая сторона задаётся типом и, если нужно, именем, файлом или версией хранилища."""
its = "Приложение 7, 7.4.4.1"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "enum", flag = "-FirstConfigurationType", values = ["MainConfiguration", "DBConfiguration", "VendorConfiguration", "ExtensionConfiguration", "ExtensionDBConfiguration", "ConfigurationRepository", "ExtensionConfigurationRepository", "File"], required = true, label = "откуда взять первую конфигурацию" },
  { kind = "string", flag = "-FirstName", label = "имя первой конфигурации (для поставщика и расширений)" },
  { kind = "file", flag = "-FirstFile", role = "input", label = "файл .cf или .cfe первой конфигурации (при типе File)" },
  { kind = "string", flag = "-FirstVersion", label = "версия хранилища для первой конфигурации (при типе из хранилища)" },
  { kind = "enum", flag = "-SecondConfigurationType", values = ["MainConfiguration", "DBConfiguration", "VendorConfiguration", "ExtensionConfiguration", "ExtensionDBConfiguration", "ConfigurationRepository", "ExtensionConfigurationRepository", "File"], required = true, label = "откуда взять вторую конфигурацию" },
  { kind = "string", flag = "-SecondName", label = "имя второй конфигурации (для поставщика и расширений)" },
  { kind = "file", flag = "-SecondFile", role = "input", label = "файл .cf или .cfe второй конфигурации (при типе File)" },
  { kind = "string", flag = "-SecondVersion", label = "версия хранилища для второй конфигурации (при типе из хранилища)" },
  { kind = "enum", flag = "-MappingRule", values = ["ByObjectName", "ByObjectIDs"], label = "как сопоставлять объекты: по именам (по умолчанию) или по внутренним идентификаторам" },
  { kind = "file", flag = "-Objects", role = "input", label = "файл со списком сравниваемых объектов" },
  { kind = "enum", flag = "-ReportType", values = ["Brief", "Full"], required = true, label = "краткий или полный отчёт" },
  { kind = "flag", flag = "-IncludeChangedObjects", label = "в отчёте показывать подчинённые объекты, которые изменились" },
  { kind = "flag", flag = "-IncludeDeletedObjects", label = "в отчёте показывать подчинённые объекты, которых больше нет" },
  { kind = "flag", flag = "-IncludeAddedObjects", label = "в отчёте показывать появившиеся подчинённые объекты" },
  { kind = "enum", flag = "-ReportFormat", values = ["txt", "mxl"], required = true, label = "формат отчёта: текст или табличный документ" },
  { kind = "file", flag = "-ReportFile", role = "output", required = true, label = "файл отчёта" },
]

[[command]]
name = "/LoadCfg"
group = "backup"
effect = "replaces"
exclusive = false
summary = "загрузить конфигурацию из файла .cf"
description = """Заменяет основную конфигурацию содержимым файла. С подпараметром -Extension загружается расширение, и если его в базе нет, оно создаётся; расширение, подключённое к хранилищу, загрузить так нельзя."""
its = "Приложение 7, 7.4.4.9"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "file", role = "input", ext = ".cf", required = true, label = "файл конфигурации (.cf, для расширения .cfe)" },
  { kind = "string", flag = "-Extension", label = "имя расширения" },
]

# Базовая форма команды измерена в T-42 (часть Б); подпараметры — по документации.
# -Format упомянут в тексте раздела, но отсутствует в строке синтаксиса и списке параметров,
# поэтому в каталоге его нет — не проверено.
[[command]]
name = "/LoadConfigFromFiles"
group = "backup"
effect = "replaces"
exclusive = false
summary = "загрузить конфигурацию из файлов XML"
description = """Принимает конфигурацию в виде набора XML-файлов — из каталога или из zip-архива — и делает её рабочей в базе. Допускает и частичную загрузку отдельных файлов по списку."""
its = "Приложение 7, 7.4.4.11"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "dir", role = "input", label = "каталог загрузки (обязателен, если не задан -Archive; вместе с ним не указывается)" },
  { kind = "string", flag = "-Extension", label = "имя расширения (не вместе с -AllExtensions)" },
  { kind = "flag", flag = "-AllExtensions", label = "загрузить расширения: каждый подкаталог — одно расширение (не вместе с -Extension, -files, -listFile)" },
  { kind = "string", flag = "-files", quoted = true, label = "файлы для частичной загрузки через запятую, весь список в кавычках (не вместе с -AllExtensions)" },
  { kind = "file", flag = "-listFile", role = "input", label = "файл со списком загружаемых файлов, по одному в строке (не вместе с -AllExtensions)" },
  { kind = "flag", flag = "-updateConfigDumpInfo", label = "в конце создать или обновить файл версий ConfigDumpInfo.xml" },
  { kind = "flag", flag = "-NoCheck", label = "не проверять целостность загружаемой конфигурации" },
  { kind = "file", flag = "-Archive", role = "input", ext = ".zip", label = "zip-архив, из которого загружать (вместо каталога загрузки)" },
  { kind = "flag", flag = "-partial", label = "частичная загрузка: только элементы описания, названные файлами" },
  { kind = "int", flag = "-JobsCount", label = "число потоков загрузки (0 — подберёт платформа)" },
]

[[command]]
name = "/UpdateDBCfg"
group = "backup"
effect = "modifies"
exclusive = true
summary = "обновить конфигурацию базы данных"
description = """Приводит структуру базы в соответствие с рабочей конфигурацией. Обычно нужен монопольный доступ; динамическое и фоновое обновление позволяют обойтись без него, но не всегда применимы."""
its = "Приложение 7, 7.4.4.16"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "enum", flag = "-Dynamic", attached = true, values = ["+", "-"], label = "динамическое обновление (по умолчанию разрешено)" },
  { kind = "enum", flag = "-DynamicRestruct", attached = true, values = ["+", "-"], label = "динамическая реструктуризация (по умолчанию запрещена)" },
  { kind = "flag", flag = "-BackgroundStart", label = "запустить фоновое обновление и сразу завершиться" },
  { kind = "flag", flag = "-BackgroundCancel", label = "отменить запущенное фоновое обновление" },
  { kind = "flag", flag = "-BackgroundFinish", label = "завершить фоновое обновление фазой принятия изменений" },
  { kind = "flag", flag = "-Visible", requires = "-BackgroundFinish", label = "показать диалог, если принять изменения не удаётся (только с -BackgroundFinish)" },
  { kind = "flag", flag = "-BackgroundSuspend", label = "приостановить фоновое обновление" },
  { kind = "flag", flag = "-BackgroundResume", label = "продолжить приостановленное фоновое обновление" },
  { kind = "flag", flag = "-WarningsAsErrors", label = "считать предупреждения ошибками" },
  { kind = "flag", flag = "-Server", label = "выполнять обновление на сервере (клиент-серверный вариант)" },
  { kind = "flag", flag = "-v1", label = "обычный механизм реструктуризации (не вместе с -v2)" },
  { kind = "flag", flag = "-v2", label = "оптимизированный механизм реструктуризации (не вместе с -v1)" },
  { kind = "string", flag = "-Extension", label = "имя расширения" },
  { kind = "enum", flag = "-SessionTerminate", values = ["disable", "force"], label = "завершать ли сеансы ради монопольной блокировки: disable (по умолчанию) или force" },
]

[[command]]
name = "/RollbackCfg"
group = "backup"
effect = "replaces"
exclusive = false
summary = "вернуться к конфигурации базы данных"
description = """Отбрасывает изменения рабочей конфигурации и возвращает ту, что хранится в базе данных. Для расширения — с подпараметром -Extension."""
its = "Приложение 7, 7.4.4.15"
reliability = "doc"
versions = { since = "8.3.18" }
args = [{ kind = "string", flag = "-Extension", label = "имя расширения" }]

[[command]]
name = "/UpdateCfg"
group = "backup"
effect = "replaces"
exclusive = false
summary = "обновить конфигурацию, стоящую на поддержке"
description = """Объединяет текущую конфигурацию с файлом поставщика или файлом обновления по заранее подготовленному файлу настроек."""
its = "Приложение 7, 7.4.6"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "file", role = "input", ext = ".cf", required = true, label = "файл конфигурации (.cf) или обновления (.cfu)" },
  { kind = "file", flag = "-Settings", role = "input", required = true, label = "файл настроек объединения" },
  { kind = "flag", flag = "-IncludeObjectsByUnresolvedRefs", label = "дополнительно включать объекты, на которые остались ссылки (не вместе с -ClearUnresolvedRefs)" },
  { kind = "flag", flag = "-ClearUnresolvedRefs", label = "очищать ссылки на невключённые объекты (не вместе с -IncludeObjectsByUnresolvedRefs)" },
  { kind = "flag", flag = "-DumpListOfTwiceChangedProperties", label = "вывести список свойств, изменённых с обеих сторон" },
  { kind = "flag", flag = "-force", label = "продолжать несмотря на предупреждения (спорные объекты исключаются или берутся по умолчанию)" },
]

[[command]]
name = "/MergeCfg"
group = "backup"
effect = "replaces"
exclusive = false
summary = "объединить конфигурацию с файлом .cf или .cfe"
description = """Вливает в текущую конфигурацию или расширение содержимое файла по правилам из файла настроек. Постановка на поддержку управляется отдельными подпараметрами."""
its = "Приложение 7, 7.4.4.12"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "file", role = "input", ext = ".cf", required = true, label = "файл объединяемой конфигурации (.cf) или расширения (.cfe)" },
  { kind = "file", flag = "-Settings", role = "input", required = true, label = "файл настроек объединения" },
  { kind = "flag", flag = "-EnableSupport", label = "поставить на поддержку (не вместе с -DisableSupport и -Extension)" },
  { kind = "flag", flag = "-DisableSupport", label = "не ставить на поддержку (не вместе с -EnableSupport и -Extension)" },
  { kind = "flag", flag = "-IncludeObjectsByUnresolvedRefs", label = "дополнительно включать объекты, на которые остались ссылки (не вместе с -ClearUnresolvedRefs)" },
  { kind = "flag", flag = "-ClearUnresolvedRefs", label = "очищать ссылки на невключённые объекты (не вместе с -IncludeObjectsByUnresolvedRefs)" },
  { kind = "string", flag = "-Extension", label = "имя расширения, с которым объединять" },
  { kind = "flag", flag = "-force", label = "продолжать несмотря на предупреждения" },
]

[[command]]
name = "/DeleteCfg"
group = "backup"
effect = "replaces"
exclusive = false
summary = "удалить расширение конфигурации"
description = """Убирает из базы одно расширение по имени либо все расширения разом. Без указания, что именно удалять, команда не работает."""
its = "Приложение 7, 7.4.4.2"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "string", flag = "-Extension", label = "имя удаляемого расширения (не вместе с -AllExtensions)" },
  { kind = "flag", flag = "-AllExtensions", label = "удалить все расширения (не вместе с -Extension)" },
]

# ── maintenance: проверки и обслуживание ──────────────────────────────────────────────────

[[command]]
name = "/IBCheckAndRepair"
group = "maintenance"
effect = "modifies"
exclusive = true
summary = "протестировать и исправить информационную базу"
description = """Запускает набор операций обслуживания: проверку целостности, реиндексацию, пересчёт итогов, сжатие и другие. Без -TestOnly найденные повреждения исправляются. В группах подпараметров допускается только один."""
its = "Приложение 7, 7.4.5.4"
reliability = "doc"
versions = { since = "8.3.18" }
args = [
  { kind = "flag", flag = "-ReIndex", label = "реиндексация таблиц" },
  { kind = "string", flag = "-LogIntegrity", label = "проверка логической целостности; через запятую можно ограничить типы объектов, например Catalogs,Documents (не вместе с -LogAndRefsIntegrity)" },
  { kind = "string", flag = "-LogAndRefsIntegrity", label = "проверка логической и ссылочной целостности; типы объектов через запятую, как у -LogIntegrity (не вместе с -LogIntegrity)" },
