summary = "язык интерфейса платформы"
description = """Код языка меню и сообщений платформы, вплотную к ключу: /Len. Из списка баз (AdditionalParameters) платформа этот ключ не применяет — только из командной строки."""
its = "Приложение 7, 7.3.6"
reliability = "fact"
from_v8i = false
args = [{ kind = "string", attached = true, required = true, label = "код языка (ru, en, …)" }]

[[key]]
name = "/VL"
group = "locale"
modes = ["enterprise", "designer"]
clients = []
versions = { since = "8.3.18" }
summary = "локализация сеанса"
description = """Код локализации, по которому форматируются числа и даты и работают ЧислоПрописью() и ПредставлениеПериода(). Пишется вплотную к ключу: /VLru_RU."""
its = "Приложение 7, 7.3.6"
reliability = "doc"
args = [{ kind = "string", attached = true, required = true, label = "код локализации (ru_RU, …)" }]

