modes = ["enterprise"]
clients = []
versions = { since = "8.5.4" }
summary = "короткий заголовок окна"
description = """Текст ставится в заголовок перед системным текстом и отделяется точкой. Изменённый ключом заголовок конфигурация потом не поменяет."""
its = "Приложение 7, 7.3.11"
reliability = "doc"
args = [{ kind = "string", required = true, label = "заголовок" }]

[[key]]
name = "/AppCaption"
group = "ui"
modes = ["enterprise"]
clients = []
versions = { since = "8.5.4" }
summary = "заголовок окна приложения"
description = """Задаёт заголовок окна целиком; с пробелами значение берут в кавычки. Конфигурация этот заголовок не изменит."""
its = "Приложение 7, 7.3.11"
reliability = "doc"
args = [{ kind = "string", required = true, label = "заголовок" }]

