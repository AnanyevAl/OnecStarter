[project]
name = "onecstarter"
version = "2.1.0"
description = "Программа запуска информационных баз 1С:Предприятие"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.10",
    "pydantic>=2.9",
    "keyring>=25.0",
    "psutil>=7",
]

[project.gui-scripts]
onecstarter = "onecstarter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pyinstaller>=6.10",
    "types-psutil>=7.2.2.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onecstarter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "build/entry.py", "build/make_icon.py", "build/smoke.py"]

# UI-слой исключён из strict: типизация Qt-сигналов даёт много ложных срабатываний.
# Ядро (domain/config/platform_1c/services) остаётся под strict — там это критично.
[[tool.mypy.overrides]]
module = "onecstarter.ui.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.ui.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "requires_1c: тест требует установленной платформы 1С на машине",
    "requires_windows_shell: тест читает наш .lnk штатным IShellLink (WScript.Shell)",
]
