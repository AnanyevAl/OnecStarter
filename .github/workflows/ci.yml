name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      # requires_windows_shell исключён: штатный IShellLink на Windows Server
      # runner не разрешает наш LinkTargetIDList (классы 0x35/0x36, снято
      # 16.08.2026), на десктопных Windows читает — открытый вопрос
      # в docs/tasks.md. Локальные прогоны гоняют тест всегда.
      - run: uv run pytest -q -m "not requires_windows_shell"
